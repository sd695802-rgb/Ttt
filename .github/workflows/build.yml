name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name games_app .
          cp /tmp/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform folders
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=ios --project-name games_app .
          cp /tmp/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r games_app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: games_app.ipa
